name: Deploy build

# Builds main on GitHub and publishes the result to the "deploy" branch.
# The hosted server downloads that branch and restarts, so it never has to
# compile Qbox itself (ops/oracle/update.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create non-secret build environment
        run: cp .env.example .env
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Publish to the deploy branch
        run: |
          rm .env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy
          git add -f $(find apps packages modules -mindepth 2 -maxdepth 2 -type d -name dist)
          git commit --quiet -m "Build of main at ${GITHUB_SHA::7}"
          git push --force origin deploy
