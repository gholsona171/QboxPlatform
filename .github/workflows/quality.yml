name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tooling:tooling@127.0.0.1:5432/qbox_tooling
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create non-secret validation environment
        run: cp .env.example .env
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Prisma schema
        run: pnpm --filter @qbox/prisma prisma:format
      - name: Validate Prisma schema
        run: pnpm --filter @qbox/prisma prisma:validate
      - name: Generate Prisma client
        run: pnpm --filter @qbox/prisma prisma:generate
      - name: Verify generated Prisma artifacts
        run: git diff --exit-code -- prisma/schema.prisma packages/prisma/src/generated
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Check patch whitespace
        run: git diff --check
