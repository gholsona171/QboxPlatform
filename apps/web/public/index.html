<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="QboxPlatform control panel for your Discord server">
  <meta name="qbox-hosting" content="live">
  <meta name="qbox-live-url" content="">
  <base href="/">
  <title>QboxPlatform</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="server-header" id="serverHeader">
        <div class="brand">
          <div class="brand-mark">QB</div>
          <div>
            <strong>QboxPlatform</strong>
            <span>Community control panel</span>
          </div>
        </div>
      </div>
      <nav class="nav" id="navigation"></nav>
      <div class="sidebar-card" id="connectionCard">
        <span class="status-dot" id="connectionDot"></span>
        <div>
          <strong id="connectionTitle">Connecting...</strong>
          <p id="connectionText">Checking the Qbox API.</p>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuToggle" aria-expanded="false" aria-controls="sidebar" aria-label="Open navigation">☰</button>
        <div>
          <h1 id="pageTitle">Overview</h1>
          <p class="breadcrumbs" id="breadcrumbs"></p>
        </div>
        <div class="topbar-actions">
          <div class="account-menu">
            <button class="profile-button" id="profileButton" aria-haspopup="true" aria-expanded="false">
              <span class="avatar" id="profileAvatar">QB</span>
              <span id="profileName">Not signed in</span>
            </button>
            <div class="profile-popover" id="profilePopover" hidden>
              <div id="profileSummary"></div>
              <a class="button compact primary" href="auth/discord/start" id="loginButton">Sign in with Discord</a>
              <button class="button compact danger" id="logoutButton" hidden>Sign out</button>
            </div>
          </div>
        </div>
      </header>

      <section class="notification-area" id="notificationArea" aria-live="polite"></section>

      <main id="content" class="content" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Confirm action</h2>
      <p id="modalBody"></p>
      <div class="modal-actions">
        <button class="button" id="modalCancel">Cancel</button>
        <button class="button danger" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="guildPickerBackdrop" hidden>
    <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="guildPickerTitle">
      <h2 id="guildPickerTitle">Switch server</h2>
      <p>Servers you and Qbox are both in.</p>
      <div id="guildPickerList"></div>
      <div class="modal-actions" id="guildPickerActions"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
